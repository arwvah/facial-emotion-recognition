# Start LM Studio's server on 127.0.0.1:1234 and load this vision model first.
vision: true
vision_model: qwen3-vl-2b-instruct
vision_url: http://127.0.0.1:1234/v1
vision_prompt: Describe the main objects and visible scene briefly. Read clearly visible text.
vision_interval: 2       # 0: press A to ask; positive: seconds between sampled requests
vision_boxes: true       # Names below model-estimated object rectangles
vision_timeout: 60
vision_max_tokens: 512
vision_max_side: 1024
object_detector: nanodet
object_threshold: 0.4
expression_model: hsemotion
expression_margin: 0.08
face_detector_size: 960
align: false           # Match HSEmotion's original bounding-crop preprocessing
tta: true
no_storage: true
