[project]
name = "facial-emotion-recognition"
version = "1.1.0"
description = "Local webcam and video facial-expression classification with a pretrained CNN"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.1,<3", "opencv-python>=4.10,<5", "onnxruntime>=1.20,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17"]
optimize = ["onnx>=1.17,<2", "openvino>=2025,<2027"]

[project.scripts]
expression-lab = "expression_lab.app:main"
expression-lab-api = "expression_lab.service:main"
expression-lab-evaluate = "expression_lab.evaluation:main"
expression-lab-optimize = "expression_lab.optimization:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["expression_lab"]

[dependency-groups]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML", "httpx>=0.27,<1", "onnx>=1.17,<2"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["expression_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
