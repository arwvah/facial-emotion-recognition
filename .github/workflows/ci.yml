name: test
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra api
      - run: uv run --extra api ruff check .
      - run: uv run --extra api ruff format --check .
      - run: uv run --extra api mypy
      - run: uv run --extra api python -m unittest discover -s tests -v
